name: Promote Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      merge-commit-sha:
        description: 'Merge commit SHA of the release PR'
        required: true
      release-version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      next-dev-version:
        description: 'Next development version (e.g. 0.2.0-SNAPSHOT)'
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'publish'))
    environment: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merge-commit-sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Verify GPG keyring
        run: gpg --list-secret-keys

      - name: Read versions
        id: versions
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE="${{ inputs.release-version }}"
            NEXT="${{ inputs.next-dev-version }}"
          else
            RELEASE=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            NEXT=$(grep -oP '(?<=<!-- next-dev-version: )[\w.-]+(?= -->)' \
              <<< '${{ github.event.pull_request.body }}')
          fi
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Guard against duplicate release
        id: guard
        run: |
          RELEASE="${{ steps.versions.outputs.release }}"
          if git tag -l "v${RELEASE}" | grep -q .; then
            echo "Tag v${RELEASE} already exists — skipping publish, proceeding to next-dev PR"
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to Maven Central
        if: steps.guard.outputs.skip_publish == 'false'
        run: mvn --batch-mode -P release deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Tag release
        if: steps.guard.outputs.skip_publish == 'false'
        run: |
          RELEASE="${{ steps.versions.outputs.release }}"
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.merge-commit-sha || github.event.pull_request.merge_commit_sha }}"
          git tag "v${RELEASE}" "${REF}"
          git push origin "v${RELEASE}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Open next development version PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="${{ steps.versions.outputs.release }}"
          NEXT="${{ steps.versions.outputs.next }}"
          git checkout -b "next-dev/${NEXT}"
          mvn --batch-mode versions:set \
            -DnewVersion="${NEXT}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          sed -i "/<artifactId>logsquelcher<\/artifactId>/{n; s/<version>[^<]*<\/version>/<version>${RELEASE}<\/version>/}" README.md
          git add -A
          git commit -m "Prepare ${NEXT} development"
          git push origin "next-dev/${NEXT}"
          /usr/bin/gh pr create \
            --base main \
            --head "next-dev/${NEXT}" \
            --title "Prepare ${NEXT} development" \
            --body "Bump version to ${NEXT} following the ${RELEASE} release."
