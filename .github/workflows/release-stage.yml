name: Stage Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      next-dev-version:
        description: 'Next development version (e.g. 0.2.0-SNAPSHOT). Defaults to minor+1.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  stage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21.0.12+101.0.LTS'
          distribution: temurin
          cache: maven

      - name: Compute next development version
        id: versions
        run: |
          RELEASE="${{ inputs.release-version }}"
          if [[ -n "${{ inputs.next-dev-version }}" ]]; then
            NEXT="${{ inputs.next-dev-version }}"
          else
            IFS='.' read -r major minor patch <<< "${RELEASE}"
            NEXT="${major}.$((minor + 1)).0-SNAPSHOT"
          fi
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch and bump version
        run: |
          RELEASE="${{ steps.versions.outputs.release }}"
          git checkout -b "release/${RELEASE}"
          mvn --batch-mode versions:set \
            -DnewVersion="${RELEASE}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          TIMESTAMP=$(TZ=UTC date "+%Y-%m-%dT%H:%M:%SZ")
          mvn --batch-mode versions:set-property \
            -Dproperty=project.build.outputTimestamp \
            -DnewVersion="${TIMESTAMP}" \
            -DgenerateBackupPoms=false
          git add -A
          git commit -m "Release ${RELEASE}"
          git push origin "release/${RELEASE}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="${{ steps.versions.outputs.release }}"
          NEXT="${{ steps.versions.outputs.next }}"
          /usr/bin/gh pr create \
            --base main \
            --head "release/${RELEASE}" \
            --title "Release ${RELEASE}" \
            --label "publish" \
            --body "$(cat <<EOF
          Release ${RELEASE}.

          <!-- next-dev-version: ${NEXT} -->
          EOF
          )"
